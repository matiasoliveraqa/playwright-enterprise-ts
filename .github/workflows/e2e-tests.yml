name: Playwright Enterprise E2E & API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_project:
        description: 'Specific browser project to execute (leave blank for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - chromium
          - firefox
          - webkit
          - mobile-safari
          - mobile-chrome
          - api

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 45
    runs-on: ubuntu-latest

    env:
      CI: true
      BASE_URL: https://www.saucedemo.com
      API_BASE_URL: https://dummyjson.com
      HEADLESS: true
      DEFAULT_TIMEOUT: 30000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify TypeScript Compilation
        run: npm run typecheck

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: |
          if [ -n "${{ github.event.inputs.test_project }}" ]; then
            npx playwright test --project="${{ github.event.inputs.test_project }}"
          else
            npx playwright test
          fi

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Upload Test Traces & Failure Media
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure-artifacts
          path: test-results/
          retention-days: 14
